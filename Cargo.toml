[package]
name = "solana-pay-request"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bs58 = "0.5"
urlencoding = "2.1"

[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = "0.24.0"